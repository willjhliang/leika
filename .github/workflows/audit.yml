name: Audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    name: Audit dependencies for known vulnerabilities
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # The oldest supported Python resolves the oldest dependency releases.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: src/leika/client/.nvmrc
      - name: Python dependencies a user installs
        run: |
          python -m venv /tmp/user
          /tmp/user/bin/pip install ".[examples]"
          /tmp/user/bin/pip freeze --exclude leika > /tmp/requirements.txt
          python -m pip install pip-audit
          pip-audit --requirement /tmp/requirements.txt --no-deps --disable-pip
      - name: Browser client dependencies
        run: npm audit --prefix src/leika/client --audit-level=moderate
