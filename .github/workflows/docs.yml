name: Docs

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

  schedule:
    - cron: "23 6 * * 1"
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    name: Build documentation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            build-constraints.txt
      # No client build: the browser bundle is resolved when a Server is
      # constructed, not on import, so autodoc runs without a Node toolchain.
      - name: Build documentation
        run: uv run --locked --extra docs --python 3.12 sphinx-build -b html -W --keep-going docs docs/_build/html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  deploy:
    needs: build
    name: Deploy documentation
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write # Required to deploy the artifact to GitHub Pages.
      id-token: write # Required for GitHub Pages' OIDC deployment token.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  linkcheck:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Check external links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            build-constraints.txt
      # External sites can be transiently unavailable, so this is a scheduled
      # signal rather than a pull-request or release publication gate.
      - name: Check external links
        run: >-
          uv run --locked --extra docs --python 3.12
          sphinx-build -b linkcheck -W --keep-going docs docs/_build/linkcheck
