name: Playwright

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    name: ${{ matrix.browser }} on Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: "3.10", browser: chromium }
          - { python-version: "3.14", browser: chromium }
          - { python-version: "3.12", browser: firefox }
          - { python-version: "3.12", browser: webkit }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m playwright install "$PLAYWRIGHT_BROWSER" --with-deps
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      - run: make build-client test-e2e E2E_WORKERS=auto
        env:
          PYTEST_ADDOPTS: --browser ${{ matrix.browser }}
      - name: Failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.browser }}-py${{ matrix.python-version }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
