name: Playwright

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    name: ${{ matrix.browser }} on Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: "3.10", browser: chromium }
          - { python-version: "3.14", browser: chromium }
          - { python-version: "3.12", browser: firefox }
          - { python-version: "3.12", browser: webkit }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-client
      - uses: ./.github/actions/setup-e2e
        with:
          browser: ${{ matrix.browser }}
          python-version: ${{ matrix.python-version }}
      - name: Browser tests
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
          LEIKA_PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv run --locked --extra dev --python "$LEIKA_PYTHON_VERSION" pytest tests/e2e -n auto --browser "$PLAYWRIGHT_BROWSER"
      - name: Failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ matrix.browser }}-py${{ matrix.python-version }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
