name: Python

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-client
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.python-version }}
      - name: Unit tests
        run: uv run --extra dev --python ${{ matrix.python-version }} pytest --ignore=tests/e2e

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Ruff
        run: |
          uvx ruff check src tests examples scripts sync_client_server.py --output-format github
          uvx ruff format --check src tests examples scripts sync_client_server.py
      - name: Pyright
        run: uv run --extra dev --python 3.12 pyright src examples
      - name: Documentation and examples
        run: python scripts/check_docs.py
