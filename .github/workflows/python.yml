name: Python

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    name: Unit tests on Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
      - run: make build-client test

  quality:
    runs-on: ubuntu-24.04
    name: Lint and type checks
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make lint typecheck
        env:
          RUFF_OUTPUT_FORMAT: github

  minimum-versions:
    runs-on: ubuntu-24.04
    # The pyproject.toml floors that Babble's Isaac Sim 5.1 pins depend on.
    name: Python 3.10 with WebSockets 12, Pillow 11.3 and Viser 0.2.11
    env:
      PIP_CONSTRAINT: tests/constraints/isaac51.txt
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: "3.10"
      - run: python -m pip check
      - run: make build-client test
      - run: python -m playwright install chromium --with-deps
      - run: python -m pytest tests/e2e/test_viser_pane.py

  platforms:
    name: Unit tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # `make build-client test`, spelled out so Windows does not need make.
      - run: python src/leika/_client_autobuild.py
      - run: python -m pytest --ignore=tests/e2e
