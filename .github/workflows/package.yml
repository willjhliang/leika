name: Package

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-client
      - uses: astral-sh/setup-uv@v5
      - name: Build distributions
        run: uv build
      - name: Check release tag matches the packaged version
        if: github.event_name == 'release'
        run: python scripts/check_release_tag.py "${{ github.event.release.tag_name }}" dist/*.whl
      - name: Check wheel contents and size
        run: python scripts/check_wheel.py dist/*.whl
      - name: Check source distribution contents
        run: python scripts/check_sdist.py dist/*.tar.gz
      - name: Base-install smoke test
        run: |
          python -m venv /tmp/leika-wheel-smoke
          /tmp/leika-wheel-smoke/bin/pip install dist/*.whl
          /tmp/leika-wheel-smoke/bin/python -c "import leika; from importlib.metadata import version; assert leika.__version__ == version('leika'), (leika.__version__, version('leika')); print('installed leika', leika.__version__)"
      - name: Examples-extra smoke test
        run: |
          python -m venv /tmp/leika-examples-smoke
          /tmp/leika-examples-smoke/bin/pip install "$(realpath dist/*.whl)[examples]"
          /tmp/leika-examples-smoke/bin/python -c "import leika, viser, plotly.graph_objects as go; from matplotlib.figure import Figure; assert go.Figure() is not None and Figure() is not None"
      - name: Source-distribution smoke test
        run: |
          python -m venv /tmp/leika-sdist-smoke
          /tmp/leika-sdist-smoke/bin/pip install dist/*.tar.gz
          /tmp/leika-sdist-smoke/bin/python -c "import leika; print('installed sdist leika', leika.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  release-python:
    if: github.event_name == 'release'
    uses: ./.github/workflows/python.yml

  release-client:
    if: github.event_name == 'release'
    uses: ./.github/workflows/client.yml

  release-docs:
    if: github.event_name == 'release'
    # A called workflow may not request more than its caller grants, and this
    # file grants `contents: read`. docs.yml's deploy job asks for Pages, so
    # without these the whole workflow is rejected before any job starts. The
    # deploy itself still skips on a tag ref; only its declaration is checked.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml

  release-e2e:
    if: github.event_name == 'release'
    uses: ./.github/workflows/e2e.yml

  publish:
    if: github.event_name == 'release'
    needs: [wheel, release-python, release-client, release-docs, release-e2e]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
