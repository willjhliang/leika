name: Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    name: Build and check distributions
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: src/leika/client/.nvmrc
          package-manager-cache: false
      - run: python -m pip install -e ".[dev]"
      - name: Check the tag matches leika.__version__
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "$TAG" = "v$(python -c 'import leika; print(leika.__version__)')"
      - run: make package
      - name: Serve the page from each installed distribution
        env:
          SMOKE_TEST: |
            import urllib.request, leika
            server = leika.Server(host="127.0.0.1", port=0, verbose=False)
            assert urllib.request.urlopen(server.url).read().startswith(b"<!doctype html>")
            server.stop()
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            python -m venv "/tmp/smoke-${artifact##*/}"
            "/tmp/smoke-${artifact##*/}/bin/pip" install "$artifact"
            "/tmp/smoke-${artifact##*/}/bin/python" -c "$SMOKE_TEST"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write # Required for PyPI Trusted Publishing through OIDC.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
