name: Set up Leika browser tests
description: Install Python dependencies and Playwright Chromium

inputs:
  python-version:
    description: Python version
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Install project
      shell: bash
      run: uv sync --extra dev
    - name: Cache browser
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: chromium-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
    - name: Install Chromium
      shell: bash
      run: uv run playwright install chromium --with-deps
