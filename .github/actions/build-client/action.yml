name: Build Leika client
description: Restore or build the generated single-file browser client

runs:
  using: composite
  steps:
    - name: Restore client build
      id: cache
      uses: actions/cache@v4
      with:
        path: src/leika/client/build
        key: leika-client-${{ runner.os }}-${{ hashFiles('src/leika/client/**') }}

    - name: Set up Node.js
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-node@v6
      with:
        node-version-file: src/leika/client/.nvmrc
        cache: npm
        cache-dependency-path: src/leika/client/package-lock.json

    - name: Build client
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      # The entry point the runtime and `make build-client` also use, so every
      # client is built the same way. It runs as a plain script: it imports only
      # the standard library, and finds the Node that setup-node just pinned
      # rather than downloading its own.
      run: python3 src/leika/_client_autobuild.py
