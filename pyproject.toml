[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "leika"
dynamic = ["version"]
description = "A lightweight canvas for interactive Python visualizations."
readme = "README.md"
license = "Apache-2.0"
license-files = [
  "LICENSE",
  "src/leika/_licenses/*",
  "src/leika/client/third-party-license-overrides/*",
  "src/leika/client/build/THIRD_PARTY_NOTICES.txt",
]
authors = [{ name = "Will Liang", email = "willjhliang@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpcore[asyncio]>=1.0.9,<2",
  "msgspec>=0.18.6,<1.0.0",
  "numpy>=1.21.3,<3.0.0",
  "pillow>=11.3,<13",
  "pygments>=2.20,<3",
  "rich>=13.3.3,<16.0.0",
  "typing-extensions>=4.4.0,<5",
  "websockets>=12.0,<18",
  "zstandard>=0.20.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/willjhliang/leika"
Documentation = "https://willjhliang.github.io/leika/"
Repository = "https://github.com/willjhliang/leika"
Issues = "https://github.com/willjhliang/leika/issues"

[project.optional-dependencies]
examples = ["matplotlib>=3.6", "plotly>=5.21,<7", "viser>=0.2.11,<2"]
dev = [
  "leika[docs,examples]",
  "build>=1",
  "imageio>=2.16.1,<3.0.0",
  "playwright>=1.40.0",
  "pyright>=1.1.390",
  "pytest>=8",
  "pytest-playwright>=0.4.0",
  "pytest-xdist>=3.0.0",
  "ruff>=0.9.3",
  "twine>=6,<7",
]
docs = [
  "furo>=2025.12.19",
  "myst-parser>=3,<5",
  "sphinx>=7,<9",
  "sphinx-autobuild>=2024.2.4",
  "sphinx-copybutton>=0.5.2",
]

[tool.hatch.version]
path = "src/leika/__init__.py"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build]
# Both distributions carry the built client, never its sources.
exclude = ["/src/leika/client"]
artifacts = [
  "/src/leika/client/build/index.html",
  "/src/leika/client/build/THIRD_PARTY_NOTICES.txt",
]

# Twine 6 rejects the core metadata 2.5 that newer Hatchling writes by default.
[tool.hatch.build.targets.sdist]
include = ["/src/leika", "/tests", "/scripts", "/examples", "/hatch_build.py", "/CHANGELOG.md"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel]
packages = ["src/leika"]
core-metadata-version = "2.4"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "plotly: tests that require the optional Plotly dependency",
  "matplotlib: tests that require the optional matplotlib dependency",
]

[tool.pyright]
include = ["src", "examples"]
exclude = [
  "docs",
  "src/leika/client/node_modules",
  "src/leika/client/build",
]
pythonVersion = "3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["node_modules", "src/leika/client/build"]

[tool.ruff.lint]
select = ["E", "F", "I", "PLC", "PLE", "PLR", "PLW"]
ignore = [
  "E501",
  "E721",
  "E731",
  "E741",
  "F722",
  "F821",
  "PLC0414",
  "PLC0415",
  "PLC1901",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR0917",
  "PLR2004",
  "PLR5501",
  "PLW0603",
  "PLW0642",
  "PLW2901",
]
